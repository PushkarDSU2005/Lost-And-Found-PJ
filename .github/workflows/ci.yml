name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint + Typecheck + Unit Tests ──────────────────────────────────
  verify:
    name: Lint · Typecheck · Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify (lint + typecheck + test:unit)
        run: pnpm verify
        env:
          # Minimal vars so lib/env.ts doesn't throw — no real DB needed
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ACCESS_MODE: public
          RESEND_API_KEY: placeholder
          CRON_SECRET: placeholder

  # ── Job 2: Integration Tests (needs Supabase secrets) ─────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify]
    # Only run when Supabase secrets are present (not on forks)
    if: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest (integration)
        run: pnpm test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCESS_MODE: public
          RESEND_API_KEY: placeholder
          CRON_SECRET: placeholder
          TEST_USER_ADMIN_EMAIL: ${{ secrets.TEST_USER_ADMIN_EMAIL }}
          TEST_USER_ADMIN_PASSWORD: ${{ secrets.TEST_USER_ADMIN_PASSWORD }}
          TEST_USER_STUDENT_A_EMAIL: ${{ secrets.TEST_USER_STUDENT_A_EMAIL }}
          TEST_USER_STUDENT_A_PASSWORD: ${{ secrets.TEST_USER_STUDENT_A_PASSWORD }}
          TEST_USER_STUDENT_B_EMAIL: ${{ secrets.TEST_USER_STUDENT_B_EMAIL }}
          TEST_USER_STUDENT_B_PASSWORD: ${{ secrets.TEST_USER_STUDENT_B_PASSWORD }}

  # ── Job 3: E2E Tests with Playwright ──────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify]
    # Only run E2E when secrets are present
    if: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCESS_MODE: public
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PLAYWRIGHT_AUTH_READY: 'true'
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          TEST_USER_ADMIN_EMAIL: ${{ secrets.TEST_USER_ADMIN_EMAIL }}
          TEST_USER_ADMIN_PASSWORD: ${{ secrets.TEST_USER_ADMIN_PASSWORD }}
          TEST_USER_STUDENT_A_EMAIL: ${{ secrets.TEST_USER_STUDENT_A_EMAIL }}
          TEST_USER_STUDENT_A_PASSWORD: ${{ secrets.TEST_USER_STUDENT_A_PASSWORD }}
          TEST_USER_STUDENT_B_EMAIL: ${{ secrets.TEST_USER_STUDENT_B_EMAIL }}
          TEST_USER_STUDENT_B_PASSWORD: ${{ secrets.TEST_USER_STUDENT_B_PASSWORD }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
